<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kolla din email</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 60px 80px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #222; }
        p { color: #666; }
    </style>
</head>
<body>
<div class="container">
    <h1>Kolla din email!</h1>
    <p>Vi har skickat en inloggningslänk till <span th:text="${username}"></span></p>
</div>
</body>
</html>
