<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Webshop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 60px 80px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 { font-size: 2rem; margin-bottom: 8px; color: #222; }
        p { color: #666; margin-bottom: 32px; }
        .buttons { display: flex; gap: 16px; justify-content: center; }
        a.btn { text-decoration: none; padding: 12px 28px; border-radius: 8px; font-size: 1rem; }
        .login { background-color: #222; color: white; }
        .register { background-color: white; color: #222; border: 2px solid #222; }
        a.btn:hover { opacity: 0.85; }
    </style>
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<div class="main-content">
    <div class="container">
        <h1>Välkommen till webshoppen</h1>
        <p>Logga in eller skapa ett konto för att börja handla</p>

        <div class="buttons" sec:authorize="isAnonymous()">
            <a href="/login" class="btn login">Logga in</a>
            <a href="/register" class="btn register">Registrera dig</a>
        </div>

        <div sec:authorize="isAuthenticated()">
            <a href="/products" class="btn login">Gå till produkter</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>

<div id="cookie-banner" style="display:none;">
    <p>Vi använder cookies för att webbplatsen ska fungera. <a href="/cookie-policy">Läs mer</a></p>
    <button onclick="acceptCookies()">Godkänn</button>
</div>

<script>
    function acceptCookies() {
        document.cookie = "cookie_consent=true; path=/; max-age=" + (365*24*60*60);
        document.getElementById("cookie-banner").style.display = "none";
    }

    if (!document.cookie.split("; ").find(row => row.startsWith("cookie_consent="))) {
        document.getElementById("cookie-banner").style.display = "flex";
    }
</script>


</body>
</html>
