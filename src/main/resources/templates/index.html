<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Webshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 60px 80px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #222;
        }

        p {
            color: #666;
            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        a {
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .login {
            background-color: #222;
            color: white;
        }

        .register {
            background-color: white;
            color: #222;
            border: 2px solid #222;
        }

        a:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Välkommen till webshoppen</h1>
    <p>Logga in eller skapa ett konto för att börja handla</p>
    <div class="buttons">
        <a href="/login" class="login">Logga in</a>
        <a href="/register" class="register">Registrera dig</a>
    </div>
</div>
</body>
</html>
