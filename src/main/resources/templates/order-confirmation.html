<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orderbekräftelse</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            margin: 40px auto;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #222; }
        .info { color: #666; margin-bottom: 32px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
        th { text-align: left; padding: 10px; border-bottom: 2px solid #222; font-size: 0.9rem; }
        td { padding: 10px; border-bottom: 1px solid #eee; color: #444; }
        .total { text-align: right; font-size: 1.1rem; font-weight: bold; color: #222; }
        .back { display: inline-block; margin-top: 24px; padding: 12px 28px; background-color: #222; color: white; text-decoration: none; border-radius: 8px; }
        .back:hover { opacity: 0.85; }
    </style>
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<div class="container">
    <h1>Tack för din beställning!</h1>
    <p class="info">
        Användare: <span th:text="${order.username}"></span> |
        Datum: <span th:text="${order.orderDate}"></span>
    </p>

    <table>
        <tr>
            <th>Produkt</th>
            <th>Antal</th>
            <th>Pris</th>
        </tr>
        <tr th:each="item : ${order.orderItems}">
            <td th:text="${item.productName}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.price} + ' kr'"></td>
        </tr>
    </table>

    <p class="total">Totalt: <span th:text="${order.totalPrice} + ' kr'"></span></p>

    <a href="/products" class="back">Fortsätt handla</a>
</div>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
