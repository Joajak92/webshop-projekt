<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Min profil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 560px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 24px; color: #222; }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            color: #444;
        }
        .info-row span:first-child { color: #888; font-size: 0.9rem; }
        .actions { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
        }
        .btn-primary { background-color: #222; color: white; }
        .btn-danger { background-color: white; color: #c0392b; border: 2px solid #c0392b; }
        .btn:hover { opacity: 0.85; }
        .message { color: green; font-size: 0.9rem; margin-top: 16px; }
    </style>
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<div class="main-content">
    <div class="container">
        <h1>Min profil</h1>

        <div class="info-row">
            <span>Email</span>
            <span th:text="${user.username}"></span>
        </div>
        <div class="info-row">
            <span>Roll</span>
            <span th:text="${user.role}"></span>
        </div>

        <p class="message" th:if="${message}" th:text="${message}"></p>

        <div class="actions">
            <form th:action="@{/profile/send-data}" method="post">
                <button class="btn btn-primary" type="submit">Skicka mina uppgifter via email</button>
            </form>

            <form th:action="@{/profile/delete}" method="post"
                  onsubmit="return confirm('Är du säker på att du vill radera ditt konto?')">
                <button class="btn btn-danger" type="submit">Radera mitt konto</button>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
